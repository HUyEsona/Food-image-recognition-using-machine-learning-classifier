<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Food Recognition</title>
    <link rel="stylesheet" href="/__CSS__/style.css">
    <link rel="stylesheet" href="/__CSS__/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
</head>
<body>
<!-- Header -->
<div class="header">
    <div class="header-content">
        <div class="logo">
            <div class="icon-box"></div>
            <h1 class="title">Dashboard</h1>
        </div>
        
        <nav class="nav-menu">
            <a href="/">Trang chủ</a>
            <a href="/navigation_menu/dashboard.html" class="active">Dashboard</a>
            <a href="/navigation_menu/about.html">Giới thiệu</a>
            <a href="/navigation_menu/reason.html">Lý do</a>
            <a href="/navigation_menu/contact.html">Liên hệ</a>
        </nav>
    </div>
</div>

<div class="dashboard-container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Tổng phân tích</div>
            <div class="stat-number" id="totalPredictions">0</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-label">Thực phẩm</div>
            <div class="stat-number" id="ingredientCount">0</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-label">Món ăn</div>
            <div class="stat-number" id="dishCount">0</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-label">Hôm nay</div>
            <div class="stat-number" id="todayCount">0</div>
        </div>
    </div>
    
    <!-- Charts -->
    <div class="chart-container">
        <h3 class="chart-title"> Xu hướng 7 ngày gần đây</h3>
        <canvas id="trendChart" height="80"></canvas>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
        <div class="chart-container">
            <h3 class="chart-title"> Top 10 Món phổ biến</h3>
            <canvas id="topPredictionsChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3 class="chart-title"> Phân bố loại thực phẩm</h3>
            <canvas id="typeDistributionChart"></canvas>
        </div>
    </div>
    
    <!-- History Table -->
    <div class="history-table">
        <h3 class="chart-title"> Lịch sử phân tích gần đây</h3>
        <div id="historyContent" class="loading">Đang tải...</div>
    </div>
</div>

<script>
let trendChart, topChart, pieChart;

async function loadDashboard() {
    try {
        // Load statistics
        const statsRes = await fetch('http://localhost:5000/api/statistics?days=7');
        const statsData = await statsRes.json();
        
        // Load history
        const historyRes = await fetch('http://localhost:5000/api/history?limit=20');
        const historyData = await historyRes.json();
        
        // Update stats cards
        document.getElementById('totalPredictions').textContent = 
            statsData.overall.total_predictions;
        document.getElementById('ingredientCount').textContent = 
            statsData.overall.ingredient_predictions;
        document.getElementById('dishCount').textContent = 
            statsData.overall.dish_predictions;
        
        // Today's count (from last daily stat)
        const today = statsData.daily[statsData.daily.length - 1];
        document.getElementById('todayCount').textContent = 
            today ? today.total_predictions : 0;
        
        // Draw charts
        drawTrendChart(statsData.daily);
        drawTopPredictionsChart(statsData.overall.top_predictions);
        drawTypeDistributionChart(statsData.overall);
        
        // Draw history table
        drawHistoryTable(historyData.history);
        
    } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('historyContent').innerHTML = 
            '<p style="color: #EF4444;">Lỗi khi tải dữ liệu</p>';
    }
}

function drawTrendChart(dailyData) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    
    if (trendChart) trendChart.destroy();
    
    trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: dailyData.map(d => new Date(d.date).toLocaleDateString('vi-VN')),
            datasets: [{
                label: 'Tổng số phân tích',
                data: dailyData.map(d => d.total_predictions),
                borderColor: '#F97316',
                backgroundColor: 'rgba(249, 115, 22, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

function drawTopPredictionsChart(topPredictions) {
    const ctx = document.getElementById('topPredictionsChart').getContext('2d');
    
    if (topChart) topChart.destroy();
    
    topChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: topPredictions.map(p => p.name),
            datasets: [{
                label: 'Số lần phân tích',
                data: topPredictions.map(p => p.count),
                backgroundColor: [
                    '#F97316', '#EF4444', '#EC4899', '#8B5CF6', '#3B82F6',
                    '#06B6D4', '#10B981', '#84CC16', '#EAB308', '#F59E0B'
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
}

function drawTypeDistributionChart(overall) {
    const ctx = document.getElementById('typeDistributionChart').getContext('2d');
    
    if (pieChart) pieChart.destroy();
    
    pieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Thực phẩm', 'Món ăn'],
            datasets: [{
                data: [overall.ingredient_predictions, overall.dish_predictions],
                backgroundColor: ['#10B981', '#F97316']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
}

function drawHistoryTable(history) {
    if (history.length === 0) {
        document.getElementById('historyContent').innerHTML = 
            '<p style="text-align: center; color: #6B7280;">Chưa có dữ liệu</p>';
        return;
    }
    
    let html = `
        <table>
            <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Loại</th>
                    <th>Kết quả</th>
                    <th>Độ chính xác</th>
                    <th>Model</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    history.forEach(item => {
        const date = new Date(item.created_at);
        const timeStr = date.toLocaleString('vi-VN');
        const typeLabel = item.food_type === 'ingredient' ? 'Thực phẩm' : 'Món ăn';
        
        html += `
            <tr>
                <td>${timeStr}</td>
                <td>${typeLabel}</td>
                <td><strong>${item.top_prediction}</strong></td>
                <td>
                    <div>${item.confidence.toFixed(1)}%</div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${item.confidence}%"></div>
                    </div>
                </td>
                <td>${item.model_name}</td>
            </tr>
        `;
    });
    
    html += '</tbody></table>';
    
    document.getElementById('historyContent').innerHTML = html;
}

// Load khi trang sẵn sàng
document.addEventListener('DOMContentLoaded', loadDashboard);

// Auto refresh mỗi 30 giây
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
